[project]
name = "balys-formation-manager"
version = "1.0.0"
description = "Application de gestion de formations"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.16",
    "pillow>=10.4",
    "weasyprint>=62",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = []
prod = ["psycopg[binary]>=3.2", "gunicorn>=23"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "*/migrations/*",
    # Modules upstream intégrés et testés localement, mais conservés proches de leur source.
    "comptabilite_ohada",
    "comptes",
    "django_paie",
    "django_rh",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
