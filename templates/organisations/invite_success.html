{% extends "layouts/dashboard.html" %}{% block page_title %}Invitation prête{% endblock %}{% block page_subtitle %}Envoyez ce lien au collaborateur concerné.{% endblock %}{% block dashboard_content %}<div class="baly-surface max-w-2xl p-5"><p class="text-sm text-slate-600">Invitation pour <strong>{{ invitation.email }}</strong></p><label class="mt-4 block text-xs font-bold text-slate-700">Lien d'accès</label><div class="mt-1 flex gap-2" x-data="{copied:false}"><input class="min-w-0 flex-1 border border-slate-300 px-3 py-2 text-sm" readonly value="{{ invitation_url }}"><button type="button" @click="navigator.clipboard.writeText('{{ invitation_url }}'); copied=true" class="baly-btn-primary px-4 py-2 text-sm font-semibold text-white" x-text="copied ? 'Copié' : 'Copier'"></button></div><a href="{% tenant_url 'organisations:members' %}" class="mt-4 inline-block text-sm font-semibold text-blue-700">Retour aux utilisateurs</a></div>{% endblock %}
