<header class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[.15em] text-[var(--baly-blue)]">{{ modal_eyebrow }}</p>
    <h2 class="mt-1 text-lg font-bold text-slate-950">{{ modal_title }}</h2>
  </div>
  <button type="button" @click="globalModalOpen = false" class="grid h-9 w-9 place-items-center rounded-md text-slate-500 hover:bg-slate-100" aria-label="Fermer">
    <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12"></path><path d="m18 6-12 12"></path></svg>
  </button>
</header>

<form
  method="post"
  hx-post="{{ request.get_full_path }}"
  hx-target="#global-modal-content"
  hx-swap="innerHTML"
>
  {% csrf_token %}
  {% include "paiements/includes/payment_form_fields.html" %}

  <footer class="sticky bottom-0 flex justify-end gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4">
    <button type="button" @click="globalModalOpen = false" class="rounded-md border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700">Annuler</button>
    <button type="submit" class="baly-btn-primary rounded-md px-5 py-2.5 text-sm font-semibold text-white">{{ submit_label }}</button>
  </footer>
</form>
