<article id="department-{{ department.pk }}" class="bg-white p-6">
  <div class="flex items-start justify-between gap-3"><span class="grid h-10 w-10 place-items-center rounded-md bg-blue-50 text-xs font-bold text-blue-700">{{ department.code|slice:":3"|upper }}</span><span class="baly-badge baly-badge-blue">{{ department.employee_set.count }} employé{{ department.employee_set.count|pluralize }}</span></div>
  <h3 class="mt-4 font-bold text-slate-950">{{ department.name }}</h3>
  <p class="mt-2 min-h-10 text-sm leading-5 text-slate-500">{{ department.description|default:"Aucune description."|truncatechars:100 }}</p>
  <div class="mt-5 border-t border-slate-100 pt-4"><p class="text-xs text-slate-500">Responsable</p><p class="mt-1 text-sm font-semibold text-slate-800">{{ department.manager|default:"Non désigné" }}</p></div>
</article>
