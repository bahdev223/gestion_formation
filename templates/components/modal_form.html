<header class="sticky top-0 z-10 flex items-center justify-between border-b border-slate-200 bg-white px-6 py-4">
  <div><p class="text-xs font-semibold uppercase tracking-[.15em] text-[var(--baly-blue)]">{{ modal_eyebrow }}</p><h2 class="mt-1 text-lg font-bold text-slate-950">{{ modal_title }}</h2></div>
  <button type="button" @click="globalModalOpen = false" class="grid h-9 w-9 place-items-center rounded-md text-slate-500 hover:bg-slate-100" aria-label="Fermer"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12"></path><path d="m18 6-12 12"></path></svg></button>
</header>
<form method="post"
      enctype="multipart/form-data"
      hx-encoding="multipart/form-data"
      hx-post="{{ request.get_full_path }}"
      hx-target="#global-modal-content"
      hx-swap="innerHTML">
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="mx-6 mt-5 border-l-3 border-red-500 bg-red-50 px-4 py-3 text-sm text-red-700">{{ form.non_field_errors }}</div>{% endif %}
  <div class="grid gap-5 p-6 md:grid-cols-2">
    {% for field in form %}
      {% include "components/form_field.html" with field=field full_width_fields=full_width_fields %}
    {% endfor %}
  </div>
  <footer class="sticky bottom-0 flex justify-end gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4">
    <button type="button" @click="globalModalOpen = false" class="rounded-md border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700">Annuler</button>
    <button type="submit" class="baly-btn-primary rounded-md px-5 py-2.5 text-sm font-semibold text-white">{{ submit_label }}</button>
  </footer>
</form>
