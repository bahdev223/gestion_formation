<div x-show="modalOpen"
     x-cloak
     @keydown.escape.window="modalOpen = false"
     class="fixed inset-0 z-50 overflow-y-auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="{{ modal_id }}-title">
  <div class="flex min-h-full items-center justify-center p-4 sm:p-6">
    <button type="button"
            class="fixed inset-0 cursor-default bg-slate-950/55 backdrop-blur-[2px]"
            aria-label="Fermer"
            @click="modalOpen = false"></button>
    <section x-show="modalOpen"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 translate-y-3 scale-[.98]"
             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
             x-transition:leave="transition ease-in duration-150"
             x-transition:leave-start="opacity-100 translate-y-0 scale-100"
             x-transition:leave-end="opacity-0 translate-y-3 scale-[.98]"
             class="relative w-full {{ modal_width|default:'max-w-2xl' }} overflow-hidden rounded-lg bg-white shadow-2xl">
      <header class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[.15em] text-[var(--baly-blue)]">{{ modal_eyebrow|default:"Formulaire" }}</p>
          <h2 id="{{ modal_id }}-title" class="mt-1 text-lg font-bold text-slate-950">{{ modal_title }}</h2>
        </div>
        <button type="button"
                @click="modalOpen = false"
                class="grid h-9 w-9 place-items-center rounded-md text-slate-500 hover:bg-slate-100 hover:text-slate-900"
                aria-label="Fermer la fenêtre">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12"></path><path d="m18 6-12 12"></path></svg>
        </button>
      </header>
      <div id="{{ modal_content_id }}" class="max-h-[75vh] overflow-y-auto">
        <div class="grid min-h-48 place-items-center text-sm text-slate-500">
          Sélectionnez une action pour charger le formulaire.
        </div>
      </div>
    </section>
  </div>
</div>
