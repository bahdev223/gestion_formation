{% if messages %}
  <div class="space-y-2">
    {% for message in messages %}
      <div class="border-l-3 {% if message.tags == 'error' %}border-red-500 bg-red-50 text-red-800{% elif message.tags == 'warning' %}border-amber-500 bg-amber-50 text-amber-800{% else %}border-emerald-500 bg-emerald-50 text-emerald-800{% endif %} px-4 py-3 text-sm">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
