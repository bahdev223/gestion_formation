<div class="{% if field.name in full_width_fields %}md:col-span-2{% endif %}">
  <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold text-slate-800">
    {{ field.label }}{% if field.field.required %} <span class="text-red-600">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1.5 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1.5 text-sm font-medium text-red-600">{{ error }}</p>{% endfor %}
</div>
