<div class="{{ wrapper_class|default:'' }}">
  <label for="{{ field.id_for_label }}" class="mb-1.5 block text-xs font-bold text-slate-700">
    {{ field.label }}{% if field.field.required %}<span class="text-red-600"> *</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-[11px] text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}
</div>
